# =========================================================
# LIFELINE OS — GOOGLE CLOUD BUILD PIPELINE (cloudbuild.yaml)
# Automated container build and deploy to Google Cloud Run
# =========================================================

steps:
  # Step 1: Build Container Image via Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lifeline-os:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lifeline-os:latest'
      - '.'

  # Step 2: Push Image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/lifeline-os:$COMMIT_SHA'

  # Step 3: Deploy to Cloud Run (Stateless Serverless Execution)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'lifeline-os-service'
      - '--image=gcr.io/$PROJECT_ID/lifeline-os:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/lifeline-os:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/lifeline-os:latest'

timeout: '900s'
options:
  logging: CLOUD_LOGGING_ONLY
